<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel Master — Plataforma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root{ --laranja:#ff9800; --grad-inicio:#ff6600; --laranja-rgb:255,152,0;
       --bg:#151515; --card:#1f1f1f; --item:#262626; --borda:#333; --texto:#f1f1f1; --texto2:#9a9a9a; }
body{ font-family:'Nunito',Arial,sans-serif; background:var(--bg); color:var(--texto); font-size:15px; line-height:1.45; }

.gate{ position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
       background:radial-gradient(circle at 30% 20%, #2a1a05, #111 65%); padding:20px; }
.gate-box{ background:var(--card); border:1px solid var(--borda); border-radius:22px; padding:36px 26px;
           width:100%; max-width:380px; text-align:center; box-shadow:0 24px 70px rgba(0,0,0,0.7); }
.gate-logo{ font-size:44px; margin-bottom:8px; }
.gate-box h1{ font-family:'Montserrat',sans-serif; font-size:20px; color:var(--laranja); margin-bottom:6px; }
.gate-box p{ color:var(--texto2); font-size:13.5px; margin-bottom:22px; }
.gate-box input{ width:100%; padding:14px; border-radius:12px; border:2px solid var(--borda); background:#181818;
                 color:var(--texto); font-size:16px; margin-bottom:12px; outline:none; font-family:inherit; }
.gate-box input:focus{ border-color:var(--laranja); }
.gate-box button{ width:100%; padding:14px; border:none; border-radius:12px; cursor:pointer;
                  background:linear-gradient(135deg,var(--grad-inicio),var(--laranja)); color:#fff;
                  font-weight:900; font-size:16px; font-family:'Montserrat',sans-serif; }
#gateMsg{ color:#ff6b6b; font-size:13.5px; margin-top:10px; min-height:18px; }

header{ position:sticky; top:0; z-index:20; background:rgba(21,21,21,0.97); backdrop-filter:blur(6px);
        border-bottom:1px solid var(--borda); padding:14px 18px; }
.topo{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; max-width:1080px; margin:0 auto; }
.topo h1{ font-family:'Montserrat',sans-serif; font-size:19px; }
.acoes{ display:flex; flex-wrap:wrap; gap:8px; }
button.btn{ background:linear-gradient(135deg,var(--grad-inicio),var(--laranja)); color:#fff; border:none;
            padding:11px 18px; border-radius:11px; font-weight:900; font-size:14.5px; cursor:pointer; font-family:'Montserrat',sans-serif; }
button.btn.sec{ background:var(--item); color:var(--texto); border:1px solid var(--borda); font-family:inherit; font-weight:800; }
button.btn:hover{ filter:brightness(1.08); }
.status{ max-width:1080px; margin:12px auto 0; font-size:13.5px; min-height:20px; color:var(--texto2); padding:0 18px; }
.status.ok{ color:#5ddc8b; } .status.erro{ color:#ff6b6b; } .status.aviso{ color:#ffd166; }

main{ max-width:1080px; margin:0 auto; padding:22px 18px 90px; }
.loja{ background:var(--card); border:1px solid var(--borda); border-radius:16px; padding:16px; margin-bottom:12px;
       display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; }
.loja .info{ display:flex; flex-direction:column; gap:3px; min-width:240px; }
.loja .info b{ font-family:'Montserrat',sans-serif; font-size:16px; }
.loja .info span{ color:var(--texto2); font-size:13px; }
.selo{ display:inline-block; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
       padding:3px 10px; border-radius:999px; margin-left:6px; }
.selo.ativo{ background:#123d22; color:#6ee7a0; } .selo.trial{ background:#3d3410; color:#ffd166; }
.selo.suspenso{ background:#3d1414; color:#ff8a80; }
.loja .botoes{ display:flex; gap:8px; }
.loja .botoes button{ padding:9px 14px; border-radius:10px; border:1px solid var(--borda); background:var(--item);
                      color:var(--texto); font-weight:800; font-size:13.5px; cursor:pointer; font-family:inherit; }
.loja .botoes button.perigo{ background:rgba(229,57,53,0.12); color:#ff8a80; border-color:rgba(229,57,53,0.4); }

.form{ background:var(--card); border:1px solid var(--borda); border-radius:16px; padding:18px; margin-bottom:18px; }
.form h2{ font-family:'Montserrat',sans-serif; font-size:18px; margin-bottom:14px; }
.grid2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }
.campo{ display:flex; flex-direction:column; gap:5px; margin-bottom:8px; }
.campo span{ font-size:13px; font-weight:800; color:var(--texto2); }
.campo small{ font-size:12px; color:#777; }
.campo input, .campo select, .campo textarea{ width:100%; padding:11px 12px; border-radius:10px; border:2px solid var(--borda);
       background:#181818; color:var(--texto); font-size:14.5px; outline:none; font-family:inherit; }
.campo input:focus, .campo select:focus, .campo textarea:focus{ border-color:var(--laranja); }
.vazio{ color:var(--texto2); text-align:center; padding:40px 0; }
</style>
</head>
<body>

<div id="gate" class="gate">
    <div class="gate-box">
        <div class="gate-logo">🛰️</div>
        <h1 id="gateTitulo">Painel Master</h1>
        <p>Cadastre e gerencie os estabelecimentos da plataforma.</p>
        <input type="password" id="gateSenha" placeholder="Senha master" autocomplete="current-password"
               onkeydown="if(event.key==='Enter') entrarMaster()">
        <button onclick="entrarMaster()">Entrar</button>
        <div id="gateMsg"></div>
    </div>
</div>

<div id="painel" style="display:none">
    <header>
        <div class="topo">
            <h1 id="tituloMaster">🛰️ Painel Master</h1>
            <div class="acoes">
                <button class="btn sec" onclick="novoForm()">+ Nova loja</button>
                <button class="btn sec" onclick="recarregar()">↻ Atualizar</button>
            </div>
        </div>
        <div id="statusBar" class="status"></div>
    </header>
    <main>
        <div class="form" id="formBox" style="display:none">
            <h2 id="formTitulo">Nova loja</h2>
            <input type="hidden" id="lId">
            <div class="grid2">
                <label class="campo"><span>Slug (subdomínio)</span><input type="text" id="lSlug" placeholder="pizzariadobairro"><small>Só letras minúsculas, números e hífen</small></label>
                <label class="campo"><span>Nome</span><input type="text" id="lNome" placeholder="Pizzaria do Bairro"></label>
                <label class="campo"><span>Status</span>
                    <select id="lStatus">
                        <option value="trial">Trial</option>
                        <option value="ativo">Ativo</option>
                        <option value="suspenso">Suspenso</option>
                    </select>
                </label>
                <label class="campo"><span>Plano</span><input type="text" id="lPlano" placeholder="basico"></label>
                <label class="campo"><span>WhatsApp (só dígitos, com 55)</span><input type="text" id="lWhatsapp" placeholder="5531999999999"></label>
                <label class="campo"><span>Chave Pix</span><input type="text" id="lPix" placeholder="31999999999"></label>
            </div>
            <label class="campo"><span>Supabase URL da loja</span><input type="text" id="lSupabaseUrl" placeholder="https://xxxx.supabase.co"></label>
            <label class="campo"><span>Supabase anon key da loja</span><textarea id="lSupabaseAnon" rows="3" placeholder="eyJhbGci..."></textarea></label>
            <div class="grid2">
                <label class="campo"><span>Mercado Pago (chave pública)</span><input type="text" id="lMp" placeholder="APP_USR-..."></label>
                <label class="campo"><span>Painel de gestão (URL)</span><input type="text" id="lPainelGestao" placeholder="https://..."></label>
            </div>
            <div class="acoes" style="margin-top:10px">
                <button class="btn" onclick="salvarLoja()">💾 Salvar loja</button>
                <button class="btn sec" onclick="fecharForm()">Cancelar</button>
            </div>
        </div>

        <div id="listaLojas"></div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3" integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC" crossorigin="anonymous"></script>
<script src="plataforma.js"></script>
<script src="master.js"></script>

</body>
</html>
